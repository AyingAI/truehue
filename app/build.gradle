plugins {
    id 'com.android.application'
}

android {
    namespace 'com.truehue.camera'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.truehue.camera'
        minSdk 31
        targetSdk 35
        versionCode 12
        versionName '0.7.0'
        testInstrumentationRunner 'com.truehue.camera.LensSmoke'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
